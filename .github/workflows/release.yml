name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Folia ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # includeUpdaterJson 必须 true：让 tauri-action 在所有 updater 启用的
          # 平台（macos-aarch64/x64 / windows-x64）生成 + 上传 .app.tar.gz /
          # .nsis.zip + 对应 .sig，并生成 latest.json。v0.4.0 设 false 导致
          # macOS runner 没生成 .app.tar.gz.sig，publish job 报
          # "Missing updater signatures for required platforms" 失败。
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          REPO="$RELEASE_REPO"

          # Download all signature files from draft release
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs

          FOLIA_SIGNATURE_DIR=sigs \
          FOLIA_UPDATE_VERSION="$VERSION" \
          FOLIA_UPDATE_TAG="$TAG" \
          FOLIA_UPDATE_NOTES="Folia $VERSION" \
          FOLIA_UPDATE_REPO="https://github.com/$REPO" \
          FOLIA_MANIFEST_OUTPUT=latest.json \
          FOLIA_REQUIRE_PLATFORMS="darwin-aarch64,darwin-x86_64,windows-x86_64" \
          npm run updater:manifest

      - name: Upload latest.json to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"
          test "$(gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" --json isDraft --jq .isDraft)" = "true"
          gh release upload "$RELEASE_TAG" latest.json \
            --repo "$RELEASE_REPO" --clobber
          # Keep the release private until its assets and signatures are verified.

