name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Folia ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # includeUpdaterJson 必须 true：让 tauri-action 在所有 updater 启用的
          # 平台（macos-aarch64/x64 / windows-x64）生成 + 上传 .app.tar.gz /
          # .nsis.zip + 对应 .sig，并生成 latest.json。v0.4.0 设 false 导致
          # macOS runner 没生成 .app.tar.gz.sig，publish job 报
          # "Missing updater signatures for required platforms" 失败。
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${{ github.repository }}"

          # Download all signature files from draft release
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs

          FOLIA_SIGNATURE_DIR=sigs \
          FOLIA_UPDATE_VERSION="$VERSION" \
          FOLIA_UPDATE_TAG="$TAG" \
          FOLIA_UPDATE_NOTES="Folia $VERSION" \
          FOLIA_UPDATE_REPO="https://github.com/$REPO" \
          FOLIA_MANIFEST_OUTPUT=latest.json \
          FOLIA_GITEE_MANIFEST_OUTPUT=latest-gitee.json \
          FOLIA_REQUIRE_PLATFORMS="darwin-aarch64,darwin-x86_64,windows-x86_64" \
          npm run updater:manifest

      - name: Upload latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json \
            --repo "${{ github.repository }}" --clobber
          gh release edit "${{ github.ref_name }}" \
            --draft=false --repo "${{ github.repository }}"

      - name: Sync to Gitee
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
        run: |
          if [ -z "${GITEE_TOKEN}" ] || [ -z "${GITEE_OWNER}" ]; then
            echo "Gitee secrets are not configured, skipping sync"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${GITEE_OWNER}/Folia"

          curl_gitee() {
            curl --silent --show-error --connect-timeout 20 --max-time 90 --retry 1 --retry-delay 2 "$@"
          }

          extract_release_id() {
            RELEASE_RESPONSE="$1" python3 - <<'PY'
          import json
          import os

          try:
              print(json.loads(os.environ.get("RELEASE_RESPONSE", "")).get("id", ""))
          except Exception:
              print("")
          PY
          }

          # Create Gitee release
          RELEASE_RESPONSE=$(curl_gitee -X POST \
            "https://gitee.com/api/v5/repos/${REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"Folia ${VERSION}\",
              \"body\": \"Folia ${VERSION} - 自动同步自 GitHub\",
              \"target_commitish\": \"main\",
              \"prerelease\": false
            }" || true)
          RELEASE_ID=$(extract_release_id "$RELEASE_RESPONSE")

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitee release may already exist, trying to reuse ${TAG}"
            RELEASE_RESPONSE=$(curl_gitee \
              "https://gitee.com/api/v5/repos/${REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" || true)
            RELEASE_ID=$(extract_release_id "$RELEASE_RESPONSE")
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "Failed to create Gitee release, skipping sync"
            exit 0
          fi
          echo "Gitee release ID: ${RELEASE_ID}"

          # Download all assets from GitHub release (excluding latest.json)
          mkdir -p release-assets
          if ! timeout 300s gh release download "$TAG" --repo "${{ github.repository }}" --dir release-assets; then
            echo "Failed to download GitHub release assets, skipping Gitee sync"
            exit 0
          fi

          # Upload build artifacts to Gitee (skip latest.json, we'll generate a Gitee version)
          for FILE in release-assets/*; do
            FILENAME=$(basename "$FILE")
            if [ "$FILENAME" = "latest.json" ]; then continue; fi
            echo "Uploading ${FILENAME} to Gitee..."
            if ! curl_gitee --fail-with-body -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${FILE}" > /dev/null; then
              echo "Failed to upload ${FILENAME} to Gitee, continuing"
            fi
          done

          # Generate Gitee-specific latest.json with exact tag download URLs.
          FOLIA_SIGNATURE_DIR=sigs \
          FOLIA_UPDATE_VERSION="$VERSION" \
          FOLIA_UPDATE_TAG="$TAG" \
          FOLIA_UPDATE_NOTES="Folia $VERSION" \
          FOLIA_UPDATE_GITEE_REPO="https://gitee.com/${REPO}" \
          FOLIA_MANIFEST_OUTPUT=/tmp/latest-github.json \
          FOLIA_GITEE_MANIFEST_OUTPUT=latest-gitee.json \
          FOLIA_REQUIRE_PLATFORMS="darwin-aarch64,darwin-x86_64,windows-x86_64" \
          npm run updater:manifest

          # Upload Gitee latest.json (named latest.json on Gitee)
          if ! curl_gitee --fail-with-body -X POST \
            "https://gitee.com/api/v5/repos/${REPO}/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@latest-gitee.json;filename=latest.json" > /dev/null; then
            echo "Failed to upload latest.json to Gitee, continuing"
          fi

          echo "Gitee release sync complete"

      # ISS-72 / ISS-84：把最新的 latest.json 同步推到一个固定的 "latest" tag，
      # 让 tauri.conf.json 里的 Gitee fallback endpoint 能稳定返回最新 manifest。
      #
      # 关键（ISS-84 根因）：Gitee 的 release 资产直链形式是
      #   /releases/download/{tag}/{file}     （download 在 tag 之前）
      # 而不是 GitHub 的关键字别名 /releases/latest/download/{file}（latest 在 download
      # 之前，Gitee 不解析这条路径）。ISS-72 当初误以为「建一个名为 latest 的 tag」就能
      # 让 /releases/latest/download/ 生效——实际不行，端点一直 404。ISS-84 把客户端
      # endpoint 改成正确的 /releases/download/latest/latest.json；本步骤上传逻辑不变
      # （仍把 latest-gitee.json 以 latest.json 名义挂到 latest tag 下）。
      - name: Sync latest manifest to fixed Gitee tag
        if: env.GITEE_TOKEN != '' && env.GITEE_OWNER != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
        run: |
          REPO="${GITEE_OWNER}/Folia"
          LATEST_TAG="latest"

          curl_gitee() {
            curl --silent --show-error --connect-timeout 20 --max-time 60 --retry 1 --retry-delay 2 "$@"
          }

          # 查询是否已存在名为 "latest" 的 release
          EXISTING_RELEASE_ID=$(curl_gitee \
            "https://gitee.com/api/v5/repos/${REPO}/releases/tags/${LATEST_TAG}?access_token=${GITEE_TOKEN}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)

          if [ -z "$EXISTING_RELEASE_ID" ]; then
            # 第一次发布时建一个固定 tag 的 release。所有错误用 || true 容忍——
            # 这个 step 失败不会让整个 publish job 失败（GitHub release 已发布）。
            CREATE_BODY=$(printf '{"access_token":"%s","tag_name":"%s","name":"Folia latest (auto)","body":"自动维护：每次发布时覆盖到此 tag，请勿手动修改。","target_commitish":"main","prerelease":false}' \
              "${GITEE_TOKEN}" "${LATEST_TAG}")
            EXISTING_RELEASE_ID=$(curl_gitee -X POST \
              "https://gitee.com/api/v5/repos/${REPO}/releases" \
              -H "Content-Type: application/json" \
              -d "$CREATE_BODY" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          fi

          if [ -z "$EXISTING_RELEASE_ID" ]; then
            echo "WARN: failed to create/find 'latest' tag release on Gitee — fallback endpoint will 404 until first sync establishes it"
            exit 0
          fi

          echo "Gitee 'latest' release ID: ${EXISTING_RELEASE_ID}"

          # 删除旧附件，避免重复上传时报错
          curl_gitee -X DELETE \
            "https://gitee.com/api/v5/repos/${REPO}/releases/${EXISTING_RELEASE_ID}/assets?name=latest.json&access_token=${GITEE_TOKEN}" \
            > /dev/null || true

          # 上传新的 latest.json（注意：必须是 Gitee 版的，URL 字段指向 gitee.com）
          if ! curl_gitee --fail-with-body -X POST \
            "https://gitee.com/api/v5/repos/${REPO}/releases/${EXISTING_RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@latest-gitee.json;filename=latest.json" > /dev/null; then
            echo "Failed to upload latest.json to 'latest' tag release, continuing"
          else
            echo "Gitee 'latest' tag manifest synced"
          fi
