name: Gitee cleanup

# 一次性维护工作流（ISS-227 / DEC-148）。
#
# 背景：Gitee 镜像自 v0.6.4 起实际失效，`latest` 标签 release 下累积了 9 份
# 同名 latest.json，服务端恒返最早一份（version 0.6.4）。客户端更新端点已
# 收敛为 GitHub 单源（PR #190），但**已安装的旧版本仍把 Gitee 当兜底**，
# 会把 GitHub 的瞬时失败伪装成「已是最新」。删除陈旧清单后，Gitee 端点返回
# 404，GitHub 失败时客户端如实报错。
#
# 用法：Actions → Gitee cleanup → Run workflow（可填 release tag，默认 latest）。
# 安全性：仅使用仓库自有 GITEE_TOKEN / GITEE_OWNER，只删除本仓库镜像下的
# latest.json 资产；不触碰任何 Gitee 版本 release 的产物。
#
# API 要点（实测）：release 对象的 assets 数组只含 name / browser_download_url，
# **没有附件 id**；带 id 的清单在 `GET .../releases/{id}/attach_files`。
# 删除端点为 `DELETE .../releases/{id}/attach_files/{attachment_id}`
# （`.../assets?name=...` 不是有效路径，返回 404 —— 当年 release.yml 里的
# 那条 DELETE 正是因此静默失效，9 份清单才越积越多）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要清理的 release 标签（默认 latest，即客户端兜底端点所用的那份）'
        required: false
        default: 'latest'
      drop_release:
        description: '若资产删除后仍有残留清单，是否整份删除该 release（默认否）'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee secrets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
        run: |
          if [ -z "${GITEE_TOKEN}" ] || [ -z "${GITEE_OWNER}" ]; then
            echo "::error::GITEE_TOKEN / GITEE_OWNER not configured"
            exit 1
          fi
          echo "secrets present"

      - name: Delete stale latest.json assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          REPO="${GITEE_OWNER}/Folia"
          API="https://gitee.com/api/v5/repos/${REPO}"
          DELETED=0

          # 删除某个 release 下所有名为 latest.json 的附件
          delete_manifests() {
            local rid="$1"
            local json="/tmp/attach_${rid}.json"
            local tsv="/tmp/assets_${rid}.tsv"
            curl -sS --fail-with-body \
              "${API}/releases/${rid}/attach_files?access_token=${GITEE_TOKEN}" \
              -o "$json"
            python3 - "$json" <<'PY' > "$tsv"
          import json, sys
          for asset in json.load(open(sys.argv[1])) or []:
              print('{}\t{}'.format(asset.get('id'), asset.get('name')))
          PY
            while IFS=$'\t' read -r asset_id asset_name; do
              [ -z "${asset_name}" ] && continue
              if [ "${asset_name}" != "latest.json" ]; then
                echo "  skip (not a manifest): ${asset_name}"
                continue
              fi
              if [ -z "${asset_id}" ] || [ "${asset_id}" = "None" ]; then
                echo "::error::asset id missing for ${asset_name} — cannot delete precisely"
                exit 1
              fi
              code=$(curl -sS -o /tmp/del.out -w '%{http_code}' -X DELETE \
                "${API}/releases/${rid}/attach_files/${asset_id}?access_token=${GITEE_TOKEN}" || true)
              echo "  delete ${asset_name} (id=${asset_id}) -> HTTP ${code}"
              case "${code}" in
                200|204) DELETED=$((DELETED + 1)) ;;
                404) DELETED=$((DELETED + 1)) ;;
              esac
            done < "$tsv"
          }

          if [ "${TARGET_TAG}" = "all" ]; then
            # 客户端端点 /releases/download/latest/latest.json 在本 release 找不到
            # 同名文件时，会回退到仓库里其它 release 的同名资产——所以必须清掉
            # **所有** release 的 latest.json，端点才会真正 404。
            echo "== all releases =="
            curl -sS --fail-with-body \
              "${API}/releases?per_page=100&access_token=${GITEE_TOKEN}" \
              -o /tmp/releases.json
            for rid in $(python3 -c 'import json;print(" ".join(str(r.get("id")) for r in json.load(open("/tmp/releases.json"))))'); do
              echo "== release ${rid} =="
              delete_manifests "${rid}"
            done
          else
            echo "== release ${TARGET_TAG} =="
            curl -sS --fail-with-body \
              "${API}/releases/tags/${TARGET_TAG}?access_token=${GITEE_TOKEN}" \
              -o /tmp/release.json
            RELEASE_ID=$(python3 -c "import json;print(json.load(open('/tmp/release.json')).get('id',''))")
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::cannot resolve release id for tag ${TARGET_TAG}"
              exit 1
            fi
            echo "release id: ${RELEASE_ID}"
            delete_manifests "${RELEASE_ID}"
          fi
          echo "delete requests accepted: ${DELETED}"

      - name: Drop release (optional)
        if: ${{ inputs.drop_release == 'true' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
        run: |
          set -euo pipefail
          REPO="${GITEE_OWNER}/Folia"
          API="https://gitee.com/api/v5/repos/${REPO}"
          # 第二道杠杆：整份删除该 release（镜像已废弃，其内容仅剩陈旧清单
          # 与自动生成的源码包，无可保留物）。
          RELEASE_ID=$(python3 -c "import json;print(json.load(open('/tmp/release.json')).get('id',''))")
          echo "drop_release=true -> deleting release ${RELEASE_ID}"
          curl -sS -o /tmp/rel_del.out -w 'DELETE release -> HTTP %{http_code}\n' -X DELETE \
            "${API}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}"
          head -c 300 /tmp/rel_del.out; echo

      - name: Verify no stale manifests remain
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          REPO="${GITEE_OWNER}/Folia"
          API="https://gitee.com/api/v5/repos/${REPO}"
          # 全仓扫描：任何一个 release 还留着 latest.json，端点就仍可能被回退命中
          curl -sS --fail-with-body \
            "${API}/releases?per_page=100&access_token=${GITEE_TOKEN}" \
            -o /tmp/releases_after.json
          for rid in $(python3 -c 'import json;print(" ".join(str(r.get("id")) for r in json.load(open("/tmp/releases_after.json"))))'); do
            curl -sS --fail-with-body \
              "${API}/releases/${rid}/attach_files?access_token=${GITEE_TOKEN}" \
              -o "/tmp/after_${rid}.json"
          done
          python3 - <<'PY'
          import glob, json
          remaining = []
          for path in glob.glob('/tmp/after_*.json'):
              for asset in json.load(open(path)) or []:
                  if asset.get('name') == 'latest.json':
                      remaining.append((path, asset.get('id')))
          print('manifests remaining across all releases: {}'.format(len(remaining)))
          for path, asset_id in remaining:
              print('  - {} id={}'.format(path, asset_id))
          if remaining:
              raise SystemExit('stale manifests still present')
          PY

      - name: Report client endpoint status
        env:
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          curl -sS -o /dev/null -w 'GET /releases/download/%s/latest.json -> HTTP %{http_code}\n' \
            "https://gitee.com/cat-xierluo/Folia/releases/download/${TARGET_TAG}/latest.json"
          curl -sL -o /tmp/endpoint_body.json -w 'followed -> HTTP %{http_code} size=%{size_download} ctype=%{content_type}\n' \
            "https://gitee.com/cat-xierluo/Folia/releases/download/${TARGET_TAG}/latest.json"
          head -c 200 /tmp/endpoint_body.json; echo
